<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poopmilk Statistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-top: #3e2723;
            --bg-bottom: #795548;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --sumar: #22c55e; --restar: #ef4444; --accent: #38bdf8;
            --avataroutline: #5d4037;
        }

        .nota-simple {
            position: fixed;
            top: 500px;
            right: 7px;
            transform: translateX(-50%);
            font-family: "system-ui", "Comic Sans", cursive;
            width: auto;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            z-index: 1000;
        }

        body { 
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; /* Altura fija al 100% de la pantalla */
            overflow: hidden; /* Evita que la página se desplace y se vea el fondo blanco */
        }

        .records-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; max-width: 500px; margin-bottom: 15px;
        }

        .record-card {
            background: rgba(14, 165, 233, 0.15); 
            backdrop-filter: blur(5px);
            border: 1px solid var(--accent);
            padding: 8px; border-radius: 12px; text-align: center;
        }

        .record-title { font-size: 0.65rem; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
        .record-name { font-weight: bold; font-size: 0.9rem; display: block; }
        .record-time { font-size: 0.7rem; color: #cbd5e1; }

        .grid-principal {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px;
            flex-grow: 1; /* Hace que el contenedor use el espacio disponible */
        }

        .tarjeta-usuario {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 8px; border-radius: 20px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            height: fit-content;
        }
        
        .avatar {
            width: 55px; height: 55px; border-radius: 50%;
            background-color: #334155; margin-bottom: 6px;
            border: 2px solid var(--avataroutline);
            object-fit: cover;
        }

        .nombre { font-weight: bold; font-size: 0.75rem; margin-bottom: 10px; color: #cbd5e1; text-transform: uppercase; }
        .controles-emoji { display: flex; justify-content: space-around; width: 100%; }
        .item-contador { display: flex; flex-direction: column; align-items: center; }
        .btn-emoji {
            background: none; border: none; font-size: 1.6rem; cursor: pointer;
            padding: 2px; transition: transform 0.1s; touch-action: manipulation;
        }
        .btn-emoji:active { transform: scale(1.3); }
        .valor { font-family: 'Quicksand', sans-serif; font-weight: bold; font-size: 1.1rem; color: #fff; }
        
        .controles-inferiores {
            padding: 20px 0;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            width: 100%;
        }

        .selector-modo {
            padding: 12px 40px; border-radius: 40px; border: none;
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer; width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modo-sumar { background-color: var(--sumar); }
        .modo-restar { background-color: var(--restar); }
        
        .btn-reset {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;
            padding: 5px 15px; border-radius: 20px; font-size: 0.65rem;
            cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="records-container">
        <div class="nota-simple">a veces pienso</div>
        <div class="record-card">
            <span class="record-title">💩 Reciente</span>
            <span id="name-reciente" class="record-name">---</span>
            <span id="time-reciente" class="record-time">...</span>
        </div>
        <div class="record-card" style="border-color: #fb923c; background: rgba(251, 146, 60, 0.1);">
            <span class="record-title" style="color: #fb923c;">💩 Estreñido</span>
            <span id="name-antiguo" class="record-name">---</span>
            <span id="time-antiguo" class="record-time">...</span>
        </div>
    </div>

    <div class="grid-principal" id="contenedor"></div>

    <div class="controles-inferiores">
        <button id="btnModo" class="selector-modo modo-sumar" onclick="cambiarModo()">MODO: SUMAR (+)</button>
        <button class="btn-reset" onclick="reiniciarTodo()">Reiniciar Estadísticas ⚠️</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD6yOf09wXPn1UBL9gMFRRFx56CumXA9cM",
          authDomain: "contador-grupal.firebaseapp.com",
          databaseURL: "https://contador-grupal-default-rtdb.firebaseio.com/",
          projectId: "contador-grupal",
          storageBucket: "contador-grupal.firebasestorage.app",
          messagingSenderId: "270723570344",
          appId: "1:270723570344:web:566dc7e3934185daf9009d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const configUsuarios = [
            { nombre: "MapachePan", foto: "pan.jpg" },
            { nombre: "I_Drive", foto: "drive.jpg" },
            { nombre: "TripleJMC", foto: "juan.jpg" },
            { nombre: "jalapapeles", foto: "rata.jpg" }
        ];

        const emojis = ["💩", "🥛", "🚿"]; 
        let modoSumar = true;
        let tiemposPoop = {};

        function cambiarModo() {
            modoSumar = !modoSumar;
            const btn = document.getElementById("btnModo");
            btn.innerText = modoSumar ? "MODO: SUMAR (+)" : "MODO: RESTAR (-)";
            btn.className = modoSumar ? "selector-modo modo-sumar" : "selector-modo modo-restar";
        }

        function reiniciarTodo() {
            if (confirm("¿Seguro que quieres borrar todas las estadísticas?")) {
                db.ref('/').remove();
                location.reload();
            }
        }

        function crearInterfaz() {
            const contenedor = document.getElementById("contenedor");
            configUsuarios.forEach(user => {
                let html = `
                <div class="tarjeta-usuario">
                    <img src="${user.foto}" class="avatar" alt="${user.nombre}">
                    <div class="nombre">${user.nombre}</div>
                    <div class="controles-emoji">`;
                
                emojis.forEach(emoji => {
                    html += `
                        <div class="item-contador">
                            <button class="btn-emoji" onclick="actualizar('${user.nombre}', '${emoji}')">${emoji}</button>
                            <div class="valor" id="${user.nombre}_${emoji}">0</div>
                        </div>`;
                });
                html += `</div></div>`;
                contenedor.innerHTML += html;
            });
        }

        function actualizar(user, emoji) {
            const delta = modoSumar ? 1 : -1;
            db.ref(`estadisticas/${user}/${emoji}`).transaction(current => {
                let nuevo = (current || 0) + delta;
                return nuevo < 0 ? 0 : nuevo;
            });
            if(emoji === "💩" && modoSumar) {
                db.ref(`timestamps/${user}`).set(firebase.database.ServerValue.TIMESTAMP);
            }
        }

        function formatTime(ms) {
            let sec = Math.floor(ms / 1000);
            let hrs = Math.floor(sec / 3600);
            sec %= 3600;
            let mins = Math.floor(sec / 60);
            sec %= 60;
            return `Hace ${hrs}h ${mins}m`;
        }

        function actualizarCronometros() {
            const ahora = Date.now();
            let entries = Object.entries(tiemposPoop);
            if(entries.length > 0) {
                entries.sort((a, b) => a[1] - b[1]); 
                const masEstre = entries[0];
                const masReci = entries[entries.length - 1];
                document.getElementById('name-antiguo').innerText = masEstre[0];
                document.getElementById('time-antiguo').innerText = formatTime(ahora - masEstre[1]);
                document.getElementById('name-reciente').innerText = masReci[0];
                document.getElementById('time-reciente').innerText = formatTime(ahora - masReci[1]);
            }
        }

        db.ref('estadisticas').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            configUsuarios.forEach(u => {
                emojis.forEach(e => {
                    const el = document.getElementById(`${u.nombre}_${e}`);
                    if(el) el.innerText = (data[u.nombre] && data[u.nombre][e]) ? data[u.nombre][e] : 0;
                });
            });
        });

        db.ref('timestamps').on('value', (snapshot) => {
            tiemposPoop = snapshot.val() || {};
        });

        setInterval(actualizarCronometros, 60000); // Actualiza cada minuto para ahorrar recursos
        crearInterfaz();
    </script>
</body>
</html>
